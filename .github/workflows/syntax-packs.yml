name: Syntax packs

on:
  workflow_dispatch:
    inputs:
      languages:
        description: Space-separated languages to build and test; empty builds every pinned language
        required: false
        default: ""
      publish:
        description: Sign and publish to blob.diffygui.com (needs every language, on master)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: syntax-packs-${{ inputs.publish && 'publish' || github.ref }}
  cancel-in-progress: false

env:
  PACK_BASE_URL: https://blob.diffygui.com/syntax-packs/v1
  PACK_INDEX_KEY: 1f3d2cb98f99da0321bdfa8549b4a43a36f96d7e25b710fb49739d46065b19f1
  TARGETS: aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc
  TREE_SITTER_CLI: 0.26.8
  S5CMD: 2.3.0
  S5CMD_SHA256: de0fdbfa3aceae55e069ba81a0fc17b2026567637603734a387b2fca06c299b4
  DIFFY_SKIP_CODESIGN: "1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install lld (macOS)
        if: runner.os == 'macOS'
        run: brew install lld

      - name: Install lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tree-sitter CLI
        run: |
          npm install --global "tree-sitter-cli@${TREE_SITTER_CLI}"
          cli="$(npm root -g)/tree-sitter-cli/tree-sitter"
          if [ "${{ runner.os }}" = Windows ]; then cli="$cli.exe"; fi
          "$cli" --version
          echo "TREE_SITTER=$cli" >> "$GITHUB_ENV"

      - name: Build and check packs
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::runner host $host cannot load ${{ matrix.target }} packs"
            exit 1
          fi
          cargo run --locked --release -p syntax-pack -- build --jobs 4 ${{ inputs.languages }}

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-packs-unsigned-${{ matrix.target }}
          path: target/syntax-packs/${{ matrix.target }}
          if-no-files-found: error

  sign:
    needs: build
    if: inputs.languages == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/download-artifact@v4
        with:
          pattern: syntax-packs-unsigned-*
          path: packs

      - name: Sign and verify every index
        env:
          DIFFY_SYNTAX_SIGNING_KEY: ${{ secrets.PHOSPHOR_PACK_INDEX_PRIVATE_KEY }}
        run: |
          cargo build --locked --release -p syntax-pack
          for target in $TARGETS; do
            mkdir -p "signed/$target"
            cp -R "packs/syntax-packs-unsigned-$target/." "signed/$target/"
            target/release/syntax-pack index --out signed --target "$target" --base-url "$PACK_BASE_URL"
          done
          PACK_DRY_RUN=1 SYNTAX_PACK=target/release/syntax-pack tools/syntax-pack/publish.sh signed > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: syntax-packs-signed
          path: signed
          if-no-files-found: error

  publish:
    needs: sign
    if: inputs.publish && inputs.languages == '' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld

      - uses: actions/download-artifact@v4
        with:
          name: syntax-packs-signed
          path: signed

      - name: Install s5cmd
        run: |
          curl -fsSLo s5cmd.tar.gz "https://github.com/peak/s5cmd/releases/download/v${S5CMD}/s5cmd_${S5CMD}_Linux-64bit.tar.gz"
          echo "${S5CMD_SHA256}  s5cmd.tar.gz" | sha256sum -c -
          sudo tar xzf s5cmd.tar.gz -C /usr/local/bin s5cmd
          s5cmd version

      - name: Publish
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PACK_R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          PACK_R2_BUCKET: diffy
        run: |
          cargo build --locked --release -p syntax-pack
          SYNTAX_PACK=target/release/syntax-pack tools/syntax-pack/publish.sh signed

  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install lld (macOS)
        if: runner.os == 'macOS'
        run: brew install lld

      - name: Install lld (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Download and highlight every pack
        run: cargo run --locked --release -p syntax-pack -- remote-check --index "$PACK_BASE_URL/{target}/index.json" --key "$PACK_INDEX_KEY"
