name: Update Phosphor Index

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        required: true
        default: all
        type: choice
        options:
          - all
          - macos-aarch64
          - macos-x86_64
          - linux-x86_64
          - windows-x86_64
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

concurrency:
  group: update-phosphor-index
  cancel-in-progress: false

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-aarch64
            os: macos-26
          - platform: macos-x86_64
            os: macos-26-intel
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: windows-x86_64
            os: windows-2025

    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      PHOSPHOR_PACK_BASE_URL: https://blob.diffygui.com/phosphor-packs
      PHOSPHOR_PACK_PLATFORM: ${{ matrix.platform }}
      PHOSPHOR_INDEX_OUTPUT: .phosphor-index/${{ matrix.platform }}.json
      PHOSPHOR_PACK_CONCURRENCY: 4
      PHOSPHOR_TREE_SITTER_CLI_VERSION: 0.26.8
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        with:
          node-version: "22"

      - name: Install tree-sitter CLI
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        run: npm install --global "tree-sitter-cli@${{ env.PHOSPHOR_TREE_SITTER_CLI_VERSION }}"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform)

      - name: Generate index
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/workflows/update-phosphor-index.mjs

      - name: Install the pinned Rust toolchain
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        run: rustup toolchain install

      - name: Install lld (macOS)
        if: runner.os == 'macOS' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform)
        run: brew install lld

      - name: Install lld (Linux)
        if: runner.os == 'Linux' && (github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform)
        run: sudo apt-get update && sudo apt-get install -y lld

      - name: Check packs load with Diffy's tree-sitter
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        env:
          DIFFY_SKIP_CODESIGN: "1"
        run: cargo run --locked -p syntax-pack -- legacy-check --out .phosphor-pack-out ${PHOSPHOR_PACK_LANGUAGES//,/ }

      - name: Sign index
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        env:
          PHOSPHOR_SIGN_INDEX_ONLY: "1"
          PHOSPHOR_PACK_INDEX_PRIVATE_KEY: ${{ secrets.PHOSPHOR_PACK_INDEX_PRIVATE_KEY }}
        run: node .github/workflows/update-phosphor-index.mjs

      - name: Upload packs to R2
        if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == matrix.platform
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: diffy
        run: |
          aws s3 sync ".phosphor-pack-out/${PHOSPHOR_PACK_PLATFORM}" "s3://${R2_BUCKET}/phosphor-packs/${PHOSPHOR_PACK_PLATFORM}" --endpoint-url "${R2_ENDPOINT_URL}" --delete
          aws s3 cp "${PHOSPHOR_INDEX_OUTPUT}" "s3://${R2_BUCKET}/phosphor-index/${PHOSPHOR_PACK_PLATFORM}.json" --endpoint-url "${R2_ENDPOINT_URL}"
