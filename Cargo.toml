[workspace]
members = [
  ".",
  "crates/diffy-diff",
  "crates/diffy-semantic",
  "crates/diffy-syntax",
  "crates/diffy-ui",
  "tools/semantic-eval",
  "tools/syntax-pack",
]
exclude = ["crates/difftastic"]

[workspace.package]
version = "0.2.3"

[workspace.dependencies]
quark = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
quark-app = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
quark-components = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
quark-render = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
quark-text = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3", default-features = false }
quark-ui = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
quark-update = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }

[package]
name = "diffy"
version.workspace = true
edition = "2024"
rust-version = "1.92"
description = "A native GPU-accelerated Git diff viewer built in Rust."
license = "GPL-3.0-only"
repository = "https://github.com/seatedro/diffy"
homepage = "https://github.com/seatedro/diffy"

[package.metadata.packager]
product-name = "Diffy"
identifier = "io.github.seatedro.diffy"
publisher = "seatedro"
out-dir = "dist/packages"
binaries-dir = "target/release"
before-packaging-command = "bash scripts/prepare-macos-icon-assets.sh && cargo build --release"
icons = [
  "assets/packaging/macos/generated/*.icns",
  "assets/packaging/diffy.ico",
  "assets/packaging/png/*.png",
]
resources = [
  "LICENSE",
  "assets/packaging/macos/generated/Assets.car*",
]

[[package.metadata.packager.binaries]]
main = true
path = "diffy"

[package.metadata.packager.macos]
info-plist-path = "assets/packaging/macos/generated/Info.plist"

[package.metadata.packager.windows]
allow-downgrades = false

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.nsis]
installer-mode = "currentUser"
appdata-paths = ["$LOCALAPPDATA/$PUBLISHER/$PRODUCTNAME"]

[features]
default = []
hot-reload = ["quark-app/hot-reload"]
difftastic = ["dep:vendored_difftastic"]
headless-render = []

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
neo_frizbee = { version = "0.13.3", default-features = false, features = ["std"] }
thiserror = "2"
dirs = "6.0"
gix = { version = "0.83", default-features = false, features = ["blob-diff", "max-performance-safe", "revision", "sha1"] }
rfd = "0.17.2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
rusqlite = { version = "0.38", default-features = false, features = ["bundled"] }
sea-query = { version = "1.0", default-features = false, features = ["backend-sqlite", "derive"] }
sea-query-rusqlite = { version = "0.8", default-features = false }
parking_lot = "0.12"
libc = "0.2"
tempfile = "3.14"
webbrowser = "1.0"
diffy-diff = { path = "crates/diffy-diff" }
diffy-semantic = { path = "crates/diffy-semantic" }
diffy-syntax = { path = "crates/diffy-syntax", features = ["download"] }
diffy-ui = { path = "crates/diffy-ui" }
quark.workspace = true
quark-app = { workspace = true, default-features = false, features = ["ui", "components", "dialogs"] }
quark-components.workspace = true
quark-text.workspace = true
quark-ui.workspace = true
vendored_difftastic = { package = "difftastic", path = "crates/difftastic", optional = true, default-features = false, features = ["dynamic-languages"] }
winit = { version = "0.30" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt", "registry", "std"] }
profiling = "1.0"
notify = "8.2.0"
ignore = ">= 0.4, < 0.4.24"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt"] }
ring = "0.17"
mimalloc = { version = "0.1.50", default-features = false }

[dev-dependencies]
git2 = { version = "0.20", default-features = false }
quark-app = { workspace = true, default-features = false, features = ["ui", "components", "test-support"] }

[[bin]]
name = "diffy"
path = "src/main.rs"

[profile.dev]
opt-level = 1
debug = 1

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
accesskit_unix = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
cosmic-text = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
taffy = { git = "https://github.com/seatedro/quark", rev = "c1904d83f0bd129112e9729fc18c592d8287d1a3" }
