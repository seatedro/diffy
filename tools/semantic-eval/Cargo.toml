[package]
name = "semantic-eval"
description = "Measures Diffy's semantic diff engines on real commits and hand-checked fixtures."
version.workspace = true
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
diffy = { path = "../..", features = ["difftastic"] }
diffy-diff = { path = "../../crates/diffy-diff" }
diffy-syntax = { path = "../../crates/diffy-syntax", features = ["download"] }
diffy-semantic = { path = "../../crates/diffy-semantic", features = ["eval"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
